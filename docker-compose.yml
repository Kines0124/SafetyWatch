services:
  detectepi:
    image: ghcr.io/kines0124/detectepi:v1.1.1
    container_name: detectepi
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: safetywatch-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: safetywatch-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - detectepi
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data: